<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Przechyl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap">
<style>
  /* Układ: jedna pełnoekranowa scena z fizyką, nakładka startowa i dwa małe przyciski na dole. */
  :root {
    --paper: #e6e8ec;
    --ink: #16171b;
    --cobalt: #2a4bd7;
    --signal: #ef4a2b;
    --sun: #f2c230;
    --blush: #f3a9c6;
    --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--display);
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; position: fixed; inset: 0; }

  .bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    gap: 10px;
    justify-content: space-between;
    align-items: center;
    padding: 12px max(16px, env(safe-area-inset-left, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  .bar > * { pointer-events: auto; }
  .hint {
    font-size: 13px;
    letter-spacing: .02em;
    opacity: .6;
    pointer-events: none;
    min-width: 0;
  }
  .btns { display: flex; gap: 8px; }
  button {
    font: 700 14px/1 var(--display);
    color: var(--ink);
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 11px 16px;
    cursor: pointer;
  }
  button:active { background: var(--sun); }
  button:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; }

  .intro {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
    gap: 18px;
    padding: 24px max(24px, env(safe-area-inset-left, 0px));
    background: var(--paper);
    z-index: 5;
  }
  .intro h1 {
    margin: 0;
    font-size: clamp(56px, 20vw, 120px);
    line-height: .9;
    letter-spacing: -.04em;
    font-weight: 700;
  }
  .intro p { margin: 0; max-width: 30ch; font-size: 17px; line-height: 1.4; }
  .intro .go {
    background: var(--ink); color: var(--paper);
    font-size: 18px; padding: 16px 28px;
  }
  .intro .go:active { background: var(--cobalt); }
  .dots { display: flex; gap: 8px; }
  .dots i { width: 22px; height: 22px; border-radius: 50%; display: block; }
  .dots i:nth-child(1) { background: var(--cobalt); }
  .dots i:nth-child(2) { background: var(--signal); border-radius: 3px; }
  .dots i:nth-child(3) { background: var(--sun); border-radius: 50% 50% 50% 0; }
  .dots i:nth-child(4) { background: var(--ink); border-radius: 3px; transform: rotate(45deg) scale(.8); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="scena"></canvas>

<div class="bar">
  <div class="hint" id="hint"></div>
  <div class="btns">
    <button id="wiecej" type="button">Dosyp</button>
    <button id="reset" type="button">Od nowa</button>
  </div>
</div>

<div class="intro" id="intro">
  <div class="dots"><i></i><i></i><i></i><i></i></div>
  <h1>Przechyl</h1>
  <p>Kształty spadają tam, gdzie przechylisz telefon. Trzymaj go pionowo i obracaj.</p>
  <button class="go" id="start" type="button">Start</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(function () {
  var M = Matter;
  var engine = M.Engine.create();
  engine.gravity.x = 0;
  engine.gravity.y = 1;

  var canvas = document.getElementById('scena');
  var W = window.innerWidth, H = window.innerHeight;
  var render = M.Render.create({
    canvas: canvas,
    engine: engine,
    options: { width: W, height: H, wireframes: false, background: 'transparent', pixelRatio: window.devicePixelRatio || 1 }
  });
  M.Render.run(render);
  M.Runner.run(M.Runner.create(), engine);

  var COLORS = ['#2a4bd7', '#ef4a2b', '#f2c230', '#f3a9c6', '#16171b', '#ffffff'];
  var walls = [];

  function buildWalls() {
    if (walls.length) M.Composite.remove(engine.world, walls);
    var t = 400, o = { isStatic: true, render: { visible: false }, friction: 0.2 };
    walls = [
      M.Bodies.rectangle(W / 2, H + t / 2, W + t * 2, t, o),
      M.Bodies.rectangle(W / 2, -t / 2, W + t * 2, t, o),
      M.Bodies.rectangle(-t / 2, H / 2, t, H + t * 2, o),
      M.Bodies.rectangle(W + t / 2, H / 2, t, H + t * 2, o)
    ];
    M.Composite.add(engine.world, walls);
  }

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    render.options.width = W;
    render.options.height = H;
    render.bounds.max.x = W;
    render.bounds.max.y = H;
    M.Render.setPixelRatio(render, window.devicePixelRatio || 1);
    buildWalls();
    var bodies = M.Composite.allBodies(engine.world);
    for (var i = 0; i < bodies.length; i++) {
      var b = bodies[i];
      if (b.isStatic) continue;
      if (b.position.x < 0 || b.position.x > W || b.position.y < 0 || b.position.y > H) {
        M.Body.setPosition(b, { x: W / 2, y: H / 2 });
        M.Body.setVelocity(b, { x: 0, y: 0 });
      }
    }
  }

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function makeShape() {
    var u = Math.min(W, H) / 11;
    var x = rnd(u, W - u), y = rnd(-H * 0.4, H * 0.5);
    var fill = pick(COLORS);
    var opt = {
      restitution: 0.35, friction: 0.15, frictionAir: 0.004, density: 0.0015,
      render: { fillStyle: fill, strokeStyle: fill === '#ffffff' ? '#16171b' : fill, lineWidth: fill === '#ffffff' ? 3 : 0 }
    };
    var kind = Math.floor(Math.random() * 6), b;
    if (kind === 0) b = M.Bodies.circle(x, y, rnd(0.45, 0.9) * u, opt);
    else if (kind === 1) b = M.Bodies.rectangle(x, y, rnd(0.9, 1.7) * u, rnd(0.9, 1.7) * u, opt);
    else if (kind === 2) b = M.Bodies.polygon(x, y, 3, rnd(0.7, 1.1) * u, opt);
    else if (kind === 3) b = M.Bodies.polygon(x, y, 6, rnd(0.6, 1) * u, opt);
    else if (kind === 4) { opt.chamfer = { radius: u * 0.3 }; b = M.Bodies.rectangle(x, y, rnd(1.8, 2.6) * u, rnd(0.55, 0.8) * u, opt); }
    else b = M.Bodies.polygon(x, y, 5, rnd(0.6, 1) * u, opt);
    M.Body.setAngle(b, rnd(0, Math.PI * 2));
    return b;
  }

  function fill(n) {
    var list = [];
    for (var i = 0; i < n; i++) list.push(makeShape());
    M.Composite.add(engine.world, list);
  }

  function clearShapes() {
    var bodies = M.Composite.allBodies(engine.world);
    for (var i = 0; i < bodies.length; i++) if (!bodies[i].isStatic) M.Composite.remove(engine.world, bodies[i]);
  }

  /* --- Grawitacja: czujnik albo palec --- */
  var target = { x: 0, y: 1 };
  var hasSensor = false;
  var hint = document.getElementById('hint');

  function onOrientation(e) {
    if (e.beta == null || e.gamma == null) return;
    hasSensor = true;
    var b = e.beta * Math.PI / 180, g = e.gamma * Math.PI / 180;
    var gx = Math.sin(g), gy = Math.sin(b);
    var a = (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : (window.orientation || 0);
    a = ((a % 360) + 360) % 360;
    var sx = gx, sy = gy;
    if (a === 90) { sx = -gy; sy = -gx; }
    else if (a === 180) { sx = -gx; sy = -gy; }
    else if (a === 270) { sx = gy; sy = gx; }
    target.x = Math.max(-1, Math.min(1, sx * 1.4));
    target.y = Math.max(-1, Math.min(1, sy * 1.4));
    hint.textContent = 'czujnik działa';
  }

  (function loop() {
    engine.gravity.x += (target.x - engine.gravity.x) * 0.18;
    engine.gravity.y += (target.y - engine.gravity.y) * 0.18;
    requestAnimationFrame(loop);
  })();

  // Bez czujnika (komputer, podgląd): przeciągnij palcem lub myszą, żeby przechylić.
  var dragging = false;
  function pointerTilt(e) {
    var dx = (e.clientX - W / 2) / (W / 2);
    var dy = (e.clientY - H / 2) / (H / 2);
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var k = Math.min(1, len) / len;
    target.x = dx * k;
    target.y = dy * k;
  }
  canvas.addEventListener('pointerdown', function (e) {
    if (hasSensor) return;
    dragging = true; pointerTilt(e);
  });
  canvas.addEventListener('pointermove', function (e) { if (dragging && !hasSensor) pointerTilt(e); });
  function release() { if (dragging) { dragging = false; target.x = 0; target.y = 1; } }
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);

  window.addEventListener('keydown', function (e) {
    var map = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (map[e.key]) { target.x = map[e.key][0]; target.y = map[e.key][1]; }
  });
  window.addEventListener('keyup', function () { if (!hasSensor) { target.x = 0; target.y = 1; } });

  /* --- Start --- */
  var intro = document.getElementById('intro');
  document.getElementById('start').addEventListener('click', function () {
    intro.hidden = true;
    var D = window.DeviceOrientationEvent;
    function listen() {
      window.addEventListener('deviceorientation', onOrientation);
      setTimeout(function () {
        if (!hasSensor) hint.textContent = 'brak czujnika: przeciągnij palcem po ekranie';
      }, 900);
    }
    if (D && typeof D.requestPermission === 'function') {
      D.requestPermission().then(function (s) {
        if (s === 'granted') listen();
        else hint.textContent = 'brak zgody na ruch: przeciągnij palcem po ekranie';
      }).catch(function () { hint.textContent = 'brak zgody na ruch: przeciągnij palcem po ekranie'; });
    } else if (D) {
      listen();
    } else {
      hint.textContent = 'brak czujnika: przeciągnij palcem po ekranie';
    }
  });

  document.getElementById('wiecej').addEventListener('click', function () { fill(12); });
  document.getElementById('reset').addEventListener('click', function () { clearShapes(); fill(40); });

  window.addEventListener('resize', resize);
  buildWalls();
  fill(40);
})();
</script>
</body>
</html>
